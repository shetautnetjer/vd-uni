name: Media regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard against personal paths in published files
        run: python3 scripts/check_public_tree.py
      - name: Scan reachable history for secrets
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)" --cap-drop ALL
          --security-opt no-new-privileges
          --mount type=bind,src="$PWD",dst=/src,readonly
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /src --redact --no-banner
      - name: Build isolated FFmpeg and VLC test environment
        run: docker build -t vd-uni:test -f tests/Dockerfile .
      - name: Python, real-media, loopback download and GUI tests
        run: >-
          docker run --rm --init --network none --cpus 2 --memory 1g
          --cap-drop ALL --security-opt no-new-privileges
          --mount type=bind,src="$PWD",dst=/work,readonly
          vd-uni:test timeout 120 xvfb-run -a python -m unittest discover -s tests -v
      - name: Browser capture logic tests
        run: >-
          docker run --rm --init --network none --cpus 2 --memory 512m
          --cap-drop ALL --security-opt no-new-privileges
          --mount type=bind,src="$PWD",dst=/work,readonly
          vd-uni:test node --test tests/test_extension.cjs
